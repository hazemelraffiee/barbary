<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for the frame -->
    <linearGradient id="frameGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#92400e;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for inner fill -->
    <linearGradient id="fillGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fef7ed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#faf8f5;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for silhouette -->
    <linearGradient id="silhouetteGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#92400e;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#78350f;stop-opacity:0.35" />
    </linearGradient>
  </defs>

  <!-- Outer octagonal frame -->
  <polygon
    points="100,8 158,29 179,87 158,145 100,166 42,145 21,87 42,29"
    fill="url(#frameGradient)"
  />

  <!-- Inner octagonal background -->
  <polygon
    points="100,18 150,36 168,87 150,138 100,156 50,138 32,87 50,36"
    fill="url(#fillGradient)"
  />

  <!-- Decorative inner border -->
  <polygon
    points="100,26 144,42 160,87 144,132 100,148 56,132 40,87 56,42"
    fill="none"
    stroke="#d97706"
    stroke-width="1"
    stroke-opacity="0.3"
  />

  <!-- Abstract head silhouette (circle) -->
  <circle
    cx="100"
    cy="65"
    r="28"
    fill="url(#silhouetteGradient)"
  />

  <!-- Abstract shoulders/body silhouette -->
  <path
    d="M60,125 Q60,105 80,100 Q100,95 120,100 Q140,105 140,125 L140,150 L60,150 Z"
    fill="url(#silhouetteGradient)"
  />

  <!-- Decorative pattern - 8-pointed star outline in center-bottom -->
  <g transform="translate(100, 175)" opacity="0.4">
    <path
      d="M0,-12 L3,-3 L12,0 L3,3 L0,12 L-3,3 L-12,0 L-3,-3 Z"
      fill="none"
      stroke="#d97706"
      stroke-width="1.5"
    />
  </g>

  <!-- Corner decorations -->
  <g opacity="0.25">
    <!-- Top -->
    <circle cx="100" cy="22" r="3" fill="#d97706"/>
    <!-- Top-right -->
    <circle cx="147" cy="39" r="2.5" fill="#d97706"/>
    <!-- Right -->
    <circle cx="164" cy="87" r="3" fill="#d97706"/>
    <!-- Bottom-right -->
    <circle cx="147" cy="135" r="2.5" fill="#d97706"/>
    <!-- Bottom -->
    <circle cx="100" cy="152" r="3" fill="#d97706"/>
    <!-- Bottom-left -->
    <circle cx="53" cy="135" r="2.5" fill="#d97706"/>
    <!-- Left -->
    <circle cx="36" cy="87" r="3" fill="#d97706"/>
    <!-- Top-left -->
    <circle cx="53" cy="39" r="2.5" fill="#d97706"/>
  </g>

  <!-- Small decorative dots between corners -->
  <g opacity="0.15">
    <circle cx="124" cy="28" r="1.5" fill="#92400e"/>
    <circle cx="156" cy="63" r="1.5" fill="#92400e"/>
    <circle cx="156" cy="111" r="1.5" fill="#92400e"/>
    <circle cx="124" cy="144" r="1.5" fill="#92400e"/>
    <circle cx="76" cy="144" r="1.5" fill="#92400e"/>
    <circle cx="44" cy="111" r="1.5" fill="#92400e"/>
    <circle cx="44" cy="63" r="1.5" fill="#92400e"/>
    <circle cx="76" cy="28" r="1.5" fill="#92400e"/>
  </g>
</svg>
