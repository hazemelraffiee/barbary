<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <!-- Subtle Islamic 8-pointed star pattern for hero backgrounds -->
  <!-- Public domain - created for tileable website use -->
  <defs>
    <pattern id="islamicStarPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.15">
        <!-- Central 8-pointed star -->
        <polygon points="30,5 35,20 50,15 40,30 50,45 35,40 30,55 25,40 10,45 20,30 10,15 25,20"/>
        <!-- Inner octagon -->
        <polygon points="30,15 38,22 38,38 30,45 22,38 22,22"/>
        <!-- Center circle -->
        <circle cx="30" cy="30" r="4"/>
        <!-- Corner elements (will tile to form continuous pattern) -->
        <line x1="0" y1="0" x2="10" y2="10"/>
        <line x1="60" y1="0" x2="50" y2="10"/>
        <line x1="0" y1="60" x2="10" y2="50"/>
        <line x1="60" y1="60" x2="50" y2="50"/>
      </g>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#islamicStarPattern)"/>
</svg>
